# ────────────────────────────────────────────
# Skills: does / when / steps / output / gate (empty = no approval needed)

[skills."action-items"]
does = "Action items from a meeting"
when = "After a meeting"
steps = ["Read notes", "who does what by when"]
output = "actions.md"
gate = ""

[skills."add-skill"]
does = "Give an existing role a new skill"
when = "Staffing decision says extend"
steps = ["Write or link the skill", "add it to the role file", "note the change"]
output = "office/roster.toml"
gate = ""

[skills."adr"]
does = "Record an architecture decision"
when = "Design decided"
steps = ["Context", "decision", "consequences"]
output = "docs/adr/"
gate = ""

[skills."approval-gate"]
does = "Hold anything outward-facing or hard to undo"
when = "Send, push to main, DB write, delete"
steps = ["Show the exact action", "wait for yes", "release"]
output = "—"
gate = "You say yes"

