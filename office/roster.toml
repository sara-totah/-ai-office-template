# Roster: the single source of truth for the office.
# Edit this file (or ask /hire), then run:  python3 tools/build_agents.py
# Each role does ONE thing. Skills live in [skills.<id>] at the bottom.

company_skills = ["pick-up-task", "ask-plain", "cite-source", "self-check", "hand-off", "report-back"]

[company]
name = "My AI Office"
tagline = "One specialist per job."
integration_branch = "develop"   # where 'ship' merges and pushes; main only when you ask


# Permission presets. tools = what the employee may use.
# extra_tools = connector (MCP) tool names, e.g. your mail app's read/draft tools.

[presets."read-only"]
note = "Reads files and the repo. Changes nothing."
tools = ["Read", "Grep", "Glob"]
extra_tools = []

[presets."analyst"]
note = "Reads everything, runs Python in a scratch folder, writes results to out/."
tools = ["Read", "Grep", "Glob", "Bash", "Write"]
extra_tools = []

[presets."builder"]
note = "Edits code inside a worktree and runs tests. Cannot push."
tools = ["Read", "Grep", "Glob", "Bash", "Edit", "Write"]
extra_tools = []

[presets."tests-only"]
note = "Edits only tests/ and fixtures. Runs tests."
tools = ["Read", "Grep", "Glob", "Bash", "Edit", "Write"]
extra_tools = []

[presets."shipper"]
note = "Commits, merges and pushes to the integration branch. Push to main and force-push are blocked."
tools = ["Read", "Grep", "Glob", "Bash"]
extra_tools = []

[presets."db-read"]
note = "SELECT queries only. Credentials from .env, never printed."
tools = ["Read", "Grep", "Glob", "Bash"]
extra_tools = []

[presets."db-write"]
note = "Writes to the DB only after you confirm the exact SQL. Reports RUN or NOT RUN."
tools = ["Read", "Grep", "Glob", "Bash", "Write"]
extra_tools = []

[presets."mail-read"]
note = "Reads mail, chat and shared drives. Sends nothing. Add your connector's read tools to extra_tools."
tools = ["Read", "Grep", "Glob", "Write"]
extra_tools = []

[presets."mail-draft"]
note = "Reads mail and chat, creates drafts. Add your connector's read and draft tools to extra_tools; never its send tool."
tools = ["Read", "Grep", "Glob", "Write"]
extra_tools = []

[presets."docs"]
note = "Reads everything, writes only docs/ and out/."
tools = ["Read", "Grep", "Glob", "Write", "Edit"]
extra_tools = []

[presets."brain"]
note = "Writes only brain/."
tools = ["Read", "Grep", "Glob", "Write", "Edit"]
extra_tools = []

[presets."office"]
note = "Writes only office/ and runs the build scripts."
tools = ["Read", "Grep", "Glob", "Bash", "Write", "Edit"]
extra_tools = []

[presets."hardware"]
note = "Asks before anything that moves a motor or changes station state."
tools = ["Read", "Grep", "Glob", "Bash", "Edit", "Write"]
extra_tools = []

[presets."ask-all"]
note = "Asks before every command that changes something."
tools = ["Read", "Grep", "Glob", "Bash"]
extra_tools = []

