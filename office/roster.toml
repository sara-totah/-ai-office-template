when = "'is it getting better?'"
steps = ["Series", "trend", "outliers"]
output = "trend.png"
gate = ""

[skills."ui-from-screenshot"]
does = "Build a UI change from a screenshot and note"
when = "'[Image] fix this'"
steps = ["Read image", "find the widget", "change", "screenshot after"]
output = "diff + screenshot"
gate = ""

[skills."user-flows"]
does = "Draw the steps a user takes"
when = "New or changed flow"
steps = ["Start", "steps", "end", "pain points"]
output = "flow.md"
gate = ""

[skills."user-guide"]
does = "A guide people will read"
when = "New app or feature"
steps = ["Tasks not features", "screenshots", "one page"]
output = "guide.md"
gate = ""

[skills."weekly-update"]
does = "Weekly team update"
when = "'status update'"
steps = ["Commits + done/", "by project", "short"]
output = "update.md"
gate = ""

[skills."what-if"]
does = "Explore a scenario"
when = "'what if we …'"
steps = ["Assume", "consequences", "risks"]
output = "what-if.md"
gate = ""

[skills."wire-filters"]
does = "Make filters filter each other"
when = "'everything filters something else'"
steps = ["Map filter chain", "wire", "test combos"]
output = "diff"
gate = ""

[skills."worktree-start"]
does = "Start code work in a fresh worktree off the integration branch"
when = "Any code change"
steps = ["New worktree", "branch from integration", "work only there"]
output = "Worktree path"
gate = ""

[skills."write-skill"]
does = "Write a new skill from the blank skill form"
when = "New skill approved"
steps = ["Trigger", "steps", "output", "gate", "add to office/roster.toml", "try it on a sample task"]
output = "office/roster.toml [skills.<id>]"
gate = ""

[skills."write-test"]
does = "Regression test for a fix"
when = "Any bug fix"
steps = ["Test that fails before", "passes after"]
output = "tests/test_*.py"
gate = ""
